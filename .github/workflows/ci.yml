name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ".[dev,api]"
      - run: python -m pytest tests -q
      - run: node --test tests/save-queue.test.mjs
      - run: python -m build
      - name: Build allowlisted release archive
        run: python scripts/package-release.py --output "${{ runner.temp }}/photo-book-workshop-1.0.0.zip"
      - name: Install wheel and run outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/wheel-env/Scripts/python.exe"; else BIN="$RUNNER_TEMP/wheel-env/bin/python"; fi
          "$BIN" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN" -m photobook_workshop demo --directory "$RUNNER_TEMP/wheel-demo"
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/package-release.py --output "${{ runner.temp }}/source.zip"
      - name: Extract the named release ZIP
        shell: python
        run: |
          import os, zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'source.zip') as archive: archive.extractall(root/'downloaded folder')
      - name: Run the downloaded Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd /d "%RUNNER_TEMP%\downloaded folder\photo-book-workshop-1.0.0"
          call Start.cmd --demo-only --directory "%RUNNER_TEMP%\launcher-demo"
      - name: Run the downloaded Mac or Linux launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/downloaded folder/photo-book-workshop-1.0.0"
          if [ "$RUNNER_OS" = "macOS" ]; then
            bash Start.command --demo-only --directory "$RUNNER_TEMP/launcher-demo"
          else
            sh Start.sh --demo-only --directory "$RUNNER_TEMP/launcher-demo"
          fi
      - name: Verify the launcher really built the complete example
        shell: python
        run: |
          import os, json, sqlite3
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'launcher-demo'
          assert (root/'first-proof/book-proof.pdf').stat().st_size > 100000
          ledger=json.loads((root/'first-proof/proof-ledger.json').read_text(encoding='utf-8'))
          assert len(ledger['pdf']['pages']) == 5 and len(ledger['html']['pages']) == 7
          with sqlite3.connect(root/'catalog.sqlite3') as db:
              assert db.execute("SELECT COUNT(*) FROM photos WHERE status='captioned'").fetchone()[0] == 6
          print('Verified six captioned example images, five PDF pages and seven HTML pages.')
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser-check.py --output "${{ runner.temp }}/browser-check"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: ${{ runner.temp }}/browser-check
