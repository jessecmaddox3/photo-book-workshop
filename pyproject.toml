[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "photo-book-workshop"
version = "1.0.0"
description = "Gather photos, choose captions and build a book, with a complete offline invented example."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Jess Maddox"}]
dependencies = ["Pillow>=12.0,<13", "reportlab>=4.4,<5", "jsonschema>=4.25,<5", "filelock>=3.19,<4"]

[project.optional-dependencies]
api = ["openai>=2.0,<3"]
decoders = ["pillow-heif>=1.1,<2", "rawpy>=0.25,<1"]
browser = ["playwright>=1.55,<2"]
dev = ["pytest>=8.4,<10", "pytest-socket>=0.7,<1", "build>=1.3,<2"]

[project.scripts]
photo-book = "photobook_workshop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/photobook_workshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost,::1"
